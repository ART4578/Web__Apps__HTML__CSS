<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile 3</title>
    <link rel="stylesheet" href="Profile.css">
</head>
<body>
    <!--dashboard profile 3-->
    <div class="dashboard__profile">
        <div class="dashboard__profile__block">
            <!--header-->
            <div class="header__profile">
                <div class="header__profile__block">
                    <div class="barter__icon">
                        <img src="../img/barter__icon.png" alt="" class="img">
                    </div>
                    <div class="header__text">
                        <p class="txt__head">Профиль</p>
                    </div>
                    <div class="notif__icon">
                        <div class="not__block">
                            <img src="../img/dashboard__notificartion.png" alt="" class="img">
                        </div>
                    </div>
                </div>
            </div>
            <!--profile-->
            <div class="profile">
                <div class="profile__block">
                    <div class="profile__camera">
                        <img src="../img/profile__3__camera.png" alt="" class="img">
                    </div>
                    <p class="pro__text__one">Артем</p>
                    <p class="pro__text__two">Декоратор</p>
                </div>
            </div>
            <!--input name-->
            <div class="input__block">
                <div class="inp__block">
                    <p class="inp__content">Имя</p>
                    <div class="inp__div">
                        <input type="text" class="inp" placeholder="Артем">
                    </div>
                </div>
            </div>
            <!--input city-->
            <div class="input__block margin__style">
                <div class="inp__block">
                    <p class="inp__content">Город</p>
                    <div class="inp__div">
                        <input type="text" class="inp" placeholder="Москва">
                    </div>
                </div>
            </div>
            <!--input email-->
            <div class="input__block margin__style">
                <div class="inp__block">
                    <p class="inp__content">E-mail</p>
                    <div class="inp__div">
                        <input type="email" class="inp" placeholder="Jonathan123@gmail.com">
                    </div>
                </div>
            </div>
            <!--input phone-->
            <div class="input__block margin__style">
                <div class="inp__block">
                    <p class="inp__content">Мобильный номер</p>
                    <div class="inp__div">
                        <input type="text" class="inp" placeholder="+7 123 3698 789">
                    </div>
                </div>
            </div>
            <!--input parol-->
            <div class="input__block margin__style">
                <div class="inp__block">
                    <p class="inp__content">Пароль</p>
                    <div class="inp__div">
                        <input type="password" class="inp" placeholder="**********">
                    </div>
                </div>
            </div>
            <!--button-->
            <div class="btn__block">
                <button class="btn">Сохранить</button>
            </div>
            <!--footer menu-->
            <div class="footer__menu">
                <div class="foot__men">
                    <div class="menu__home">
                        <img src="../img/menu__home.png" alt="" class="img">
                    </div>
                    <div class="menu__proekt">
                        <img src="../img/menu__proekt.png" alt="" class="img">
                    </div>
                    <div class="menu__finance">
                        <img src="../img/menu__finance.png" alt="" class="img">
                    </div>
                    <div class="menu__barter">
                        <img src="../img/menu__barter.png" alt="" class="img">
                    </div>
                    <div class="menu__settings">
                        <img src="../img/menu__settings.png" alt="" class="img">
                    </div>
                    <div class="menu__exit">
                        <img src="../img/menu__exit.png" alt="" class="img">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
