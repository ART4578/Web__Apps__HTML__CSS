<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL 2</title>
    <link rel="stylesheet" href="GL.css">
</head>
<body>
    <!--gl 2-->
    <div class="gl">
        <div class="gl__block">
            <!--barter icon btn-->
            <div class="barter__icon__btn">
                <div class="bart__icon">
                    <img src="../img/barter__icon.png" alt="" class="img">
                </div>
                <div class="bart__btn">
                    <button class="button">
                       <p class="button__text">создать профиль</p>
                       <img src="../img/gl__1__group.png" alt="" class="img">
                    </button>
                </div>
            </div>
            <!--search input-->
            <div class="search__input">
                <div class="search__input__block">
                    <div class="search__icon">
                        <img src="../img/mesto__search.png" alt="" class="img">
                    </div>
                    <div class="search__inp">
                        <input type="text" class="inp" placeholder="Поиск товаров и услуг">
                    </div>
                    <div class="search__filter">
                        <img src="../img/filter.png" alt="" class="img">
                    </div>
                </div>
            </div>
            <!--barter block-->
            <div class="barter__block">
                <div class="bart__block">
                    <p class="text__one">О  проекте</p>
                    <p class="text__two">БАРТЕРИЯ</p>
                    <img src="../img/gl__barter.png" alt="" class="img">
                    <button class="gl__btn">Подробнее</button>
                </div>
            </div>
            <!--barter icons-->
            <div class="barter__icons">
                <div class="barter__icons__block">
                    <div class="bart__icon__one">
                        <div class="icon__block__one">
                            <img src="../img/barter__icon.png" alt="" class="img">
                        </div>
                        <p class="text__one">Бартеры</p>
                    </div>
                    <div class="bart__icon__two">
                        <div class="icon__block__two">
                            <img src="../img/notebook.png" alt="" class="img">
                        </div>
                        <p class="text__two">Бартеры</p>
                    </div>
                    <div class="bart__icon__three">
                        <div class="icon__block__three">
                            <img src="../img/gl__2__messanger.png" alt="" class="img">
                        </div>
                        <p class="text__three">Отзывы</p>
                    </div>
                </div>
            </div>
            <!--barter safety support-->
            <div class="safety__support">
                <div class="safety__support__block">
                    <div class="safety__block">
                       <div class="safety__icon">
                            <img src="../img/Group 1449234782.png" alt="" class="img">
                       </div>
                       <div class="safety__text">Безопасность</div>
                    </div>
                    <div class="support__block">
                        <div class="support__icon">
                            <img src="../img/Group 7770.png" alt="" class="img">
                       </div>
                       <div class="support__text">Безопасность</div>
                    </div>
                </div>
            </div>
            <!--offers events-->
            <div class="offers__events">
                <div class="offers__events__block">
                    <!--offers-->
                    <div class="offers">
                        <div class="offers__text">
                            <p class="off">Предложения</p>
                        </div>
                        <div class="offers__icon">
                            <img src="../img/offers__image.png" alt="" class="img">
                        </div>
                        <div class="offers__btn">
                            <button class="off__btn">Подробнее</button>
                        </div>
                    </div>
                    <!--events-->
                    <div class="events">
                        <div class="events__text">
                            <p class="event">События</p>
                        </div>
                        <div class="events__icon">
                            <img src="../img/events__image.png" alt="" class="img">
                        </div>
                        <div class="events__btn">
                            <button class="event__btn">Подробнее</button>
                        </div>
                    </div>
                </div>
            </div>
            <!--footer menu-->
            <div class="footer__menu">
                <div class="foot__men">
                    <div class="menu__home">
                        <img src="../img/menu__home.png" alt="" class="img">
                    </div>
                    <div class="menu__proekt">
                        <img src="../img/menu__proekt.png" alt="" class="img">
                    </div>
                    <div class="menu__finance">
                        <img src="../img/menu__finance.png" alt="" class="img">
                    </div>
                    <div class="menu__barter">
                        <img src="../img/menu__barter.png" alt="" class="img">
                    </div>
                    <div class="menu__settings">
                        <img src="../img/menu__settings.png" alt="" class="img">
                    </div>
                    <div class="menu__exit">
                        <img src="../img/menu__exit.png" alt="" class="img">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
