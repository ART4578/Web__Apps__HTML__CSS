<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop Add Pin</title>
    <link rel="stylesheet" href="Pop__Add__Pin.css">
</head>
<body>
    <!--otp varification-->
    <div class="otp__varification">
        <div class="otp__varification__block">
            <!--header-->
            <div class="varification__header">
                <div class="varif__head">
                    <!--arrow left icon-->
                    <div class="varif__arrow">
                        <img src="../img/arrow__left.png" alt="" class="img">
                    </div>
                    <!--text-->
                    <div class="varif__text">
                        <p class="txt__var">Проверка</p>
                    </div>
                    <!--notification icon-->
                    <div class="varif__notif">
                        <img src="../img/dashboard__notificartion.png" alt="" class="img">
                    </div>
                </div>
            </div>
            <!--verification-->
            <div class="verification">
                <div class="verification__block">
                    <img src="../img/verification.png" alt="" class="img">
                </div>
            </div>
            <!--verification text-->
            <div class="verification__text">
                <p class="ver__txt__one">Код</p>
                <p class="ver__txt__two">На номер телефона выслан <br> код <span class="color__style">+7 123 3698 789</span></p>
            </div>
            <!--verification values-->
            <div class="verification__values">
                <div class="verification__values__block">
                    <div class="value__block__child">
                        <p class="text__val">*</p>
                    </div>
                    <div class="value__block__childs"></div>
                    <div class="value__block__childs"></div>
                    <div class="value__block__childs"></div>
                </div>
            </div>
            <!--question-->
            <div class="question">
                <p class="quest__one">Не получили пароль?</p>
                <a href="#" class="quest__two">Повторить</a>
            </div>
            <!--button next-->
            <div class="next__btn">
                <button class="button">Продолжить</button>
            </div>
            <!--footer menu-->
            <div class="footer__menu">
                <div class="foot__men">
                    <div class="menu__home">
                        <img src="../img/menu__home.png" alt="" class="img">
                    </div>
                    <div class="menu__proekt">
                        <img src="../img/menu__proekt.png" alt="" class="img">
                    </div>
                    <div class="menu__finance">
                        <img src="../img/menu__finance.png" alt="" class="img">
                    </div>
                    <div class="menu__barter">
                        <img src="../img/menu__barter.png" alt="" class="img">
                    </div>
                    <div class="menu__settings">
                        <img src="../img/menu__settings.png" alt="" class="img">
                    </div>
                    <div class="menu__exit">
                        <img src="../img/menu__exit.png" alt="" class="img">
                    </div>
                </div>
            </div>
        </div>
        <!--popup-->
        <div class="popup__block">
            <!--clear icon-->
            <div class="clear__block">
                <div class="clear">
                    <img src="../img/clear.png" alt="" class="img">
                </div>
            </div>
            <!--new pin-->
            <div class="new__pin">
                <div class="new__pin__block">
                    <!--text-->
                    <div class="new__pin__text">
                        <p class="text__pin__new">Введите новый Пин код</p>
                    </div>
                    <!--verification values-->
                    <div class="verification__values">
                        <div class="verification__values__block">
                            <div class="value__block__child">
                                <p class="text__val">*</p>
                            </div>
                            <div class="value__block__childs"></div>
                            <div class="value__block__childs"></div>
                            <div class="value__block__childs"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!--confirm pin-->
            <div class="confirm__pin">
                <div class="confirm__pin__block">
                    <!--text-->
                    <div class="conf__pin__text">
                        <p class="text__pin__conf">Подтвердите</p>
                    </div>
                    <!--verification values-->
                    <div class="verification__values">
                        <div class="verification__values__block">
                            <div class="value__block__child">
                                <p class="text__val">*</p>
                            </div>
                            <div class="value__block__childs"></div>
                            <div class="value__block__childs"></div>
                            <div class="value__block__childs"></div>
                        </div>
                    </div>
                    <!--coping-->
                    <div class="coping">
                        <div class="coping__block">
                            <p class="cop__text">Совадение</p>
                            <img src="../img/coping.png" alt="" class="cop__img">
                        </div>
                    </div>
                </div>
            </div>
            <!--button next verification-->
            <div class="next__btn__verif">
                <button class="next__btn__verif__block">Продолжить</button>
            </div>
        </div>
    </div>
</body>
</html>
