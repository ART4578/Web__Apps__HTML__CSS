<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bartery</title>
    <link rel="stylesheet" href="Bartery.css">
</head>
<body>
    <!--onboarding 2-->
    <div class="onboarding__two">
        <div class="onboard__block">
            <!--image-->
            <div class="onboard__img">
                <img src="../img/onboarding__header.png" alt="" class="img">
            </div>
            <!--Игра начинается-->
            <!--text-->
            <div class="onboard__txt">
                <div class="text__icon">
                    <p class="text__on">Игра<br> <span class="color">начинается</span></p>
                    <img src="../img/union__onboarding.png" alt="" class="img">
                </div>
                <div class="text__content">
                    <p class="cont">Бартерия - это уникальная игра, где вы можете <br> обмениваться товарами и услугами без <br> использования денег. Мы стремимся создать <br> дружественное и включающее сообщество, где <br> каждый может найти что-то ценное. <br> Присоединяйтесь к нам и начните свое бартерное <br> приключение сегодня!</p>
                </div>
                <div class="btn__divs">
                    <div class="divs__block">
                        <div class="block__one"></div>
                        <div class="block__two"></div>
                    </div>
                    <div class="btn__block">
                        <button class="button">Далее</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
