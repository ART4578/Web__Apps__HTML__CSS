<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesto 4</title>
    <link rel="stylesheet" href="Mesto.css">
</head>
<body>
    <!--mesto 4-->
    <div class="mesto">
        <!--mesto block-->
        <div class="mesto__block">
            <!--maps image-->
           <div class="maps__image">
                <!--header-->
                <div class="header">
                    <div class="header__block">
                        <div class="user__icon">
                            <img src="../img/dashboard__user.png" alt="" class="img">
                        </div>
                        <div class="header__text">
                            <p class="txt__head">Место события</p>
                        </div>
                        <div class="notif__icon">
                            <img src="../img/dashboard__notificartion.png" alt="" class="img">
                        </div>
                    </div>
                </div>
                <!--saerch input-->
                <div class="search">
                    <div class="search__block">
                        <div class="search__icon">
                            <img src="../img/mesto__search.png" alt="" class="img">
                        </div>
                        <div class="search__inp">
                            <input type="text" placeholder="Поиск" class="inp">
                        </div>
                    </div>
                </div>
                <!--geolocation images-->
                <img src="../img/mesto__geolocation__image__2.png" alt="" class="img__geol__1">
                <img src="../img/mesto__geolocation__image__2.png" alt="" class="img__geol__2">
                <img src="../img/mesto__geolocation.png" alt="" class="img__geol__3">
                <img src="../img/mesto__geolocation__image__3.png" alt="" class="img__geol__4">
                <img src="../img/mesto__geolocation__image__1.png" alt="" class="img__geol__5">
                <!--mesto running-->
                <div class="mesto__running">
                    <div class="mesto__running__block">
                        <div class="running__block__one">
                            <img src="../img/mesto__running.png" alt="" class="img">
                            <p class="run__one__txt">540 м</p>
                        </div>
                        <div class="running__border">
                            <img src="../img/mesto__line.png" alt="" class="img">
                        </div>
                        <div class="running__block__two">
                            <img src="../img/mesto__clock.png" alt="" class="img">
                            <p class="run__two__txt">10 мин</p>
                        </div>
                    </div>
                </div>
           </div> 
           <!--hotel-->
            <div class="hotel">
                <div class="hotel__block">
                    <div class="hotel__icon">
                        <img src="../img/mesto__home.png" alt="" class="img__home">
                    </div>
                    <div class="hotel__txts">
                        <p class="hotel__txt__one">Гостиница</p>
                        <p class="hotel__txt__two">Южная</p>
                    </div>
                </div>
            </div>
            <!--shopping center-->
            <div class="shopping">
                <div class="shopping__block">
                    <div class="shopping__icon">
                        <img src="../img/mesto__maps__icon.png" alt="" class="img__shopping">
                    </div>
                    <div class="shopping__txts">
                        <p class="shopping__txt__one">Торговый центр Меркурий</p>
                        <p class="shopping__txt__two">Fintech Canal Branch, NYC</p>
                    </div>
                </div>
            </div>
            <!--button-->
            <div class="btn__block">
                <button class="btn">Участвую</button>
            </div>
            <!--footer menu--> 
            <div class="footer__menu">
                <div class="foot__men">
                    <div class="menu__home">
                        <img src="../img/menu__home.png" alt="" class="img">
                    </div>
                    <div class="menu__proekt">
                        <img src="../img/menu__proekt.png" alt="" class="img">
                    </div>
                    <div class="menu__finance">
                        <img src="../img/menu__finance.png" alt="" class="img">
                    </div>
                    <div class="menu__barter">
                        <img src="../img/menu__barter.png" alt="" class="img">
                    </div>
                    <div class="menu__settings">
                        <img src="../img/menu__settings.png" alt="" class="img">
                    </div>
                    <div class="menu__exit">
                        <img src="../img/menu__exit.png" alt="" class="img">
                    </div>
                </div>
            </div>
        </div>
        <!--mesto popup-->
        <div class="mesto__popup">
            <div class="mesto__popup__block">
                <!--close icon-->
                <div class="close__icon">
                    <img src="../img/clear.png" alt="" class="img">
                </div>
                <!--input name-->
                <div class="input__block">
                    <p class="inp__txt">Имя</p>
                    <div class="inp__div">
                        <input type="text" placeholder="Артем" class="inp">
                    </div>
                </div>
                <!--input email-->
                <div class="input__block margin__left">
                    <p class="inp__txt">Email</p>
                    <div class="inp__div">
                        <input type="text" placeholder="Jonathan123@gmail.com" class="inp">
                    </div>
                </div>
                <!--input mobile-->
                <div class="input__block margin__left">
                    <p class="inp__txt">Мобильный номер</p>
                    <div class="inp__div">
                        <input type="text" placeholder="+7 123 3698 789" class="inp">
                    </div>
                </div>
                <!--button-->
                <div class="btn__send__block">
                    <button class="btn__send">Отправить</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
