<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Variant 1</title>
    <link rel="stylesheet" href="Signup.css">
</head>
<body>
    <!--signup-->
    <div class="signup">
        <div class="signup__block">
            <!--image header-->
            <div class="signup__image">
                <img src="../img/signup__1__elipse.png" alt="" class="img">
            </div>
            <!--signup inputs-->
            <div class="signup__inputs">
                <!--header-->
                <div class="header__txt">
                    <p class="txt__head">Создайте <br> учетную запись</p>
                </div>
                <!--inputs-->
                <div class="inp__block">
                    <div class="inp__name__block">
                        <input type="text" class="inp" placeholder="Имя">
                    </div>
                </div>
                <div class="inp__block margin__style">
                    <div class="inp__name__block">
                        <input type="email" class="inp" placeholder="Email">
                    </div>
                </div>
                <div class="inp__block margin__style">
                    <div class="inp__name__block">
                        <input type="text" class="inp" placeholder="Телефон">
                    </div>
                </div>
                <div class="inp__block margin__style">
                    <div class="inp__password__block">
                        <div class="inp__val">
                            <input type="password" class="inp" placeholder="Пароль">
                        </div>
                        <div class="inp__img">
                            <img src="../img/login__eye-slash.png" alt="" class="img">
                        </div>
                    </div>
                </div>
                <!--input checkbox-->
                <div class="check__one">
                    <div class="ch__one__block">
                        <div class="inp__check">
                            <input type="radio" class="inp">
                        </div>
                        <div class="inp__text">
                            <p class="txt__text">Согласен на обработку персональных данных</p>
                        </div>
                    </div>
                </div>
                <div class="two__check">
                    <div class="ch__one__block">
                        <div class="inp__check">
                            <input type="radio" class="inp">
                        </div>
                        <div class="inp__text">
                            <p class="txt__text">Принимаю политику конфиденциальности</p>
                        </div>
                    </div>
                </div>
                <!--button-->
                <div class="btn__create">
                    <button class="btn">Cоздать</button>
                </div>
                <!--input checkbox-->
                <div class="three__check">
                    <div class="ch__one__block">
                        <div class="inp__check">
                            <input type="radio" class="inp">
                        </div>
                        <div class="inp__text">
                            <p class="txt__text">Принимаю политику конфиденциальности</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
