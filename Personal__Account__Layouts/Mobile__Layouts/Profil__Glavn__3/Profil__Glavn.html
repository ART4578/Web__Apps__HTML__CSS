<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Glavn 3</title>
    <link rel="stylesheet" href="Profil__Glavn.css">
</head>
<body>
    <!--dashboard profil glavn 1-->
    <div class="dashboard__profil__glavn">
        <div class="dashboard__profil__glavn__block">
            <!--header-->
            <div class="header">
                <div class="header__block">
                    <div class="user__icon">
                        <img src="../img/profile__barter.png" alt="" class="img">
                    </div>
                    <div class="header__text">
                        <p class="txt__head">Привет, Артем</p>
                    </div>
                    <div class="notif__icon">
                        <img src="../img/dashboard__notificartion.png" alt="" class="img">
                    </div>
                </div>
            </div>
            <!--button-->
            <div class="create__btn__block">
                <button class="btn__create">Создать предложение</button>
            </div>
            <!--lipeck-->
            <div class="lipeck">
                <div class="lipeck__block">
                    <img src="../img/lipeck__vector__1.png" alt="" class="img__one">
                    <img src="../img/lipeck__vector__2.png" alt="" class="img__two">
                    <img src="../img/sobitija__maps.png" alt="" class="img__three">
                    <p class="lip__content">Липецк</p>
                    <img src="../img/sobitija__lipeck.png" alt="" class="img__lipeck">
                    <button class="arrow__left">
                        <img src="../img/profil__glavn__arrow__left.png" alt="" class="img__arrow">
                    </button>
                </div>
            </div>
            <!--search input-->
            <div class="search__input">
                <div class="search__input__block">
                    <div class="search__icon">
                        <img src="../img/search.png" alt="" class="img">
                    </div>
                    <div class="search__inp">
                        <input type="text" class="inp" placeholder="Поиск товаров и услуг">
                    </div>
                    <div class="search__filter">
                        <img src="../img/filter.png" alt="" class="img">
                    </div>
                </div>
            </div>
            <!--barter icons-->
            <div class="barter__icons">
                <div class="barter__icons__block">
                    <div class="bart__icon__one">
                        <div class="icon__block__one">
                            <img src="../img/barter__icon.png" alt="" class="img">
                        </div>
                        <p class="text__one">Бартеры</p>
                    </div>
                    <div class="bart__icon__two">
                        <div class="icon__block__two">
                            <img src="../img/notebook.png" alt="" class="img">
                        </div>
                        <p class="text__two">Бартеры</p>
                    </div>
                    <div class="bart__icon__three">
                        <div class="icon__block__three">
                            <img src="../img/Wallet_alt.png" alt="" class="img">
                        </div>
                        <p class="text__three">Отзывы</p>
                    </div>
                </div>
            </div>
            <!--barter safety support-->
            <div class="barter__safety__support">
                <div class="barter__safety__support__block">
                    <!--barter 4-->
                    <div class="bart__icon__four">
                        <div class="icon__block__four">
                            <img src="../img/chat-bubble.png" alt="" class="img">
                        </div>
                        <p class="text__four">Отзывы</p>
                    </div>
                    <!--barter 5-->
                    <div class="bart__icon__five">
                        <div class="icon__block__five">
                            <img src="../img/Group 7770.png" alt="" class="img">
                        </div>
                        <p class="text__five">Поддержка</p>
                    </div>
                    <!--barter 6-->
                    <div class="bart__icon__six">
                        <div class="icon__block__six">
                            <img src="../img/telephone.png" alt="" class="img">
                        </div>
                        <p class="text__six">Контакты</p>
                    </div>
                    <!--barter 7-->
                    <div class="bart__icon__seven">
                        <div class="icon__block__seven">
                            <img src="../img/Group 1449234782.png" alt="" class="img">
                        </div>
                        <p class="text__seven">Контакты</p>
                    </div>
                </div>
            </div>
            <!--sugesstion text-->
            <div class="sugesstion__text">
                <div class="sugess__block">
                    <p class="sugess__txt">Мои предложения</p>
                </div>
            </div>
            <!--sugesstion products-->
            <div class="sugesstion__products">
                <div class="sugesstion__products__block">
                    <!--sugeesstion product 1-->
                    <div class="sugesstion__product__one">
                        <div class="pro__block__one">
                            <img src="../img/my__sugesstions__1.png" alt="" class="img">
                        </div>
                        <p class="text__pro__one">Сумка</p>
                        <p class="text__pro__two">Б 40.000 </p>                 
                    </div>
                    <!--sugeesstion product 2-->
                    <div class="sugesstion__product__one margin__left">
                        <div class="pro__block__one">
                            <img src="../img/my__sugesstions__2.png" alt="" class="img">
                        </div>
                        <p class="text__pro__one">Сумка</p>
                        <p class="text__pro__two">Б 40.000 </p> 
                    </div>
                    <!--sugeesstion product 3-->
                    <div class="sugesstion__product__one margin__left">
                        <div class="pro__block__one">
                            <img src="../img/my__sugesstions__3.png" alt="" class="img">
                        </div>
                        <p class="text__pro__one">Сумка</p>
                        <p class="text__pro__two">Б 40.000 </p> 
                    </div>
                </div>
            </div>
            <!--sugesstion text 2-->
            <div class="sugesstion__text__two">
                <div class="sugess__block__two">
                    <p class="sugess__txt__two">Будут инересны</p>
                </div>
            </div>
            <!--barter product-->
            <div class="barter__product barter__products">
                <div class="barter__product__block">
                    <!--img-->
                    <div class="product__img">
                        <img src="../img/netfilx__3.png" alt="" class="img">
                    </div>
                    <!--text-->
                    <div class="product__txts">
                        <p class="pro__text__one">Арт портрет</p>
                        <div class="pro__text__two">Художник <span class="color__style">арт</span></div>
                    </div>
                    <!--value-->
                    <div class="product__value">
                        <p class="value__text">Б3.300</p>
                    </div>
                </div>
            </div>
            <!--footer menu-->
            <div class="footer__menu">
                <div class="foot__men">
                    <div class="menu__home">
                        <img src="../img/menu__home.png" alt="" class="img">
                    </div>
                    <div class="menu__proekt">
                        <img src="../img/menu__proekt.png" alt="" class="img">
                    </div>
                    <div class="menu__finance">
                        <img src="../img/menu__finance.png" alt="" class="img">
                    </div>
                    <div class="menu__barter">
                        <img src="../img/menu__barter.png" alt="" class="img">
                    </div>
                    <div class="menu__settings">
                        <img src="../img/menu__settings.png" alt="" class="img">
                    </div>
                    <div class="menu__exit">
                        <img src="../img/menu__exit.png" alt="" class="img">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
