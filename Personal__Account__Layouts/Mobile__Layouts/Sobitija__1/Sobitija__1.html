<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobitija 1</title>
    <link rel="stylesheet" href="Sobitija__1.css">
</head>
<body>
    <!--sobitija 1-->
    <div class="sobitija">
        <div class="sobitija__block">
            <!--header-->
            <div class="header">
                <div class="header__block">
                    <div class="arrow__left">
                        <img src="../img/arrow__left.png" alt="" class="img">
                    </div>
                    <div class="user__img">
                        <img src="../img/dashboard__user.png" alt="" class="img">
                    </div>
                    <div class="header__txt">
                        <p class="txt__head">События</p>
                    </div>
                    <div class="notification">
                        <img src="../img/dashboard__notificartion.png" alt="" class="img">
                    </div>
                </div>
            </div>
            <!--lipeck-->
            <div class="lipeck">
                <div class="lipeck__block">
                    <!--lipeck img-->
                    <div class="lipeck__img">
                        <img src="../img/sobitija__maps.png" alt="" class="lipeck__maps">
                        <p class="lip__txt">Липецк</p>
                        <img src="../img/sobitija__lipeck.png" alt="" class="lip__img">
                    </div>
                    <!--lipeck content-->
                    <div class="lipeck__content">
                        <div class="lip__cont">
                            <div class="lip__content">
                                <p class="content__one">Бизнес встреча</p>
                                <p class="content__two">Торговый центр <br> «Меркурий»</p>
                                <p class="content__three">30.10.2023   19.00</p>
                            </div>
                            <div class="lip__btn">
                                <button class="button">Смотреть</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--pushkin-->
            <div class="pushkin">
                <div class="pushkin__block">
                    <!--pushkin img-->
                    <div class="pushkin__img">
                        <img src="../img/sobitija__maps.png" alt="" class="pushkin__maps">
                        <p class="push__txt">Пушкино</p>
                        <img src="../img/sobitija__pushkin.png" alt="" class="push__img">
                    </div>
                    <!--pushkin content-->
                    <div class="pushkin__content">
                        <div class="push__cont">
                            <div class="push__content">
                                <p class="content__one">Финтех</p>
                                <p class="content__two">Торговый центр <br> «Меркурий»</p>
                                <p class="content__three">26.10.2023   19.00</p>
                            </div>
                            <div class="push__btn">
                                <button class="button">Смотреть</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--ekatirinburg-->
            <div class="ekatirinburg">
                <div class="ekatirinburg__block">
                    <!--ekatirinburg img-->
                    <div class="ekatirinburg__img">
                        <img src="../img/sobitija__maps.png" alt="" class="ekatirinburg__maps">
                        <p class="ekat__txt">Екатеренбург</p>
                        <img src="../img/sobitija__Ekatirinburg 1.png" alt="" class="ekat__img">
                    </div>
                    <!--ekatirinburg content-->
                    <div class="ekatirinburg__content">
                        <div class="ekat__cont">
                            <div class="ekat__content">
                                <p class="content__one">Встреча</p>
                                <p class="content__two">Торговый центр <br> «Меркурий»</p>
                                <p class="content__three">26.10.2023   20.00</p>
                            </div>
                            <div class="ekat__btn">
                                <button class="button">Смотреть</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--footer menu-->
            <div class="footer__menu">
                <div class="foot__men">
                    <div class="menu__home">
                        <img src="../img/menu__home.png" alt="" class="img">
                    </div>
                    <div class="menu__proekt">
                        <img src="../img/menu__proekt.png" alt="" class="img">
                    </div>
                    <div class="menu__finance">
                        <img src="../img/menu__finance.png" alt="" class="img">
                    </div>
                    <div class="menu__barter">
                        <img src="../img/menu__barter.png" alt="" class="img">
                    </div>
                    <div class="menu__settings">
                        <img src="../img/menu__settings.png" alt="" class="img">
                    </div>
                    <div class="menu__exit">
                        <img src="../img/menu__exit.png" alt="" class="img">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
