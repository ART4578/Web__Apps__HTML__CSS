<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soob Oplata</title>
    <link rel="stylesheet" href="Soob__Oplata.css">
</head>
<body>
    <!--dashboard soob-->
    <div class="dashboard__soob">
        <!--dashboard soob block-->
        <div class="dashboard__soob__block">
            <!--header-->
            <div class="varification__header">
                <div class="varif__head">
                    <!--arrow left icon-->
                    <div class="varif__arrow">
                        <img src="../img/arrow__left.png" alt="" class="img">
                    </div>
                    <!--text-->
                    <div class="varif__text">
                        <p class="txt__var">Сделка</p>
                    </div>
                    <!--date-->
                    <div class="varif__date">
                        <img src="../img/dashboard__date.png" alt="" class="img">
                    </div>
                    <!--notification icon-->
                    <div class="varif__notif">
                        <img src="../img/dashboard__notificartion.png" alt="" class="img">
                    </div>
                </div>
            </div>
            <!--bouquet-->
            <div class="bouquet">
                <div class="bouquet__block">
                    <!--bouquet img-->
                    <div class="bouquet__img"></div>
                    <!--img header-->
                    <div class="bouq__head">
                        <div class="header__img">
                            <p class="head__one">Арт Букет</p>
                            <p class="header__two">На ДР Бабушке</p>
                        </div>
                        <div class="discount">
                            <div class="discount__block">
                                <p class="discount__txt">20%</p>
                            </div>
                        </div>
                    </div>
                    <!--text button-->
                    <div class="bouq__btn__txt">
                        <p class="bouq__txt">Б2 500</p>
                        <button class="bouq__btn">Купить</button>
                    </div>
                </div>
            </div>
            <!--neural networks-->
            <div class="networks">
                <div class="networks__block">
                    <!--networks img-->
                    <div class="networks__img"></div>
                    <!--img header-->
                    <div class="net__head">
                        <div class="header__img">
                            <p class="head__one">Нейросети</p>
                            <p class="header__two">Онланй курс 40 уроков</p>
                        </div>
                        <div class="discount">
                            <div class="discount__block">
                                <p class="discount__txt">20%</p>
                            </div>
                        </div>
                    </div>
                    <!--text button-->
                    <div class="net__btn__txt">
                        <p class="net__txt">Б2 500</p>
                        <button class="net__btn">Купить</button>
                    </div>
                </div>
            </div>
            <!--footer menu-->
            <div class="footer__menu">
                <div class="foot__men">
                    <div class="menu__home">
                        <img src="../img/menu__home.png" alt="" class="img">
                    </div>
                    <div class="menu__proekt">
                        <img src="../img/menu__proekt.png" alt="" class="img">
                    </div>
                    <div class="menu__finance">
                        <img src="../img/menu__finance.png" alt="" class="img">
                    </div>
                    <div class="menu__barter">
                        <img src="../img/menu__barter.png" alt="" class="img">
                    </div>
                    <div class="menu__settings">
                        <img src="../img/menu__settings.png" alt="" class="img">
                    </div>
                    <div class="menu__exit">
                        <img src="../img/menu__exit.png" alt="" class="img">
                    </div>
                </div>
            </div>
        </div>
        <!--dashboard-->
        <div class="dashboard__popup">
            <div class="dash__popup">
                <!--close icon-->
                <div class="close__icon">
                    <img src="../img/clear.png" alt="" class="img">
                </div>
                <!--input value-->
                <div class="input__value">
                    <p class="inp__text">Бартеры</p>
                    <div class="inp__div">
                        <input type="text" placeholder="Б 2 000" class="inp">
                    </div>
                </div>
                <!--design-->
                <div class="design">
                    <p class="design__txt">Оформить</p>
                    <div class="design__blocks">
                        <button class="btn__one">Б1500</button>
                        <button class="btn__two">Б 2000</button>
                        <button class="btn__three">Б 3500</button>
                    </div>
                </div>
                <!--next button-->
                <div class="next__block">
                    <button class="next__btn">Предложить</button>
                </div>
                <!--numbers button-->
                <div class="numbers__btn__block">
                    <div class="numbers__btn">
                        <button class="num__one">1</button>
                        <button class="num__two">2</button>
                        <button class="num__three">3</button>
                        <button class="num__four">4</button>
                        <button class="num__five">5</button>
                        <button class="num__six">6</button>
                        <button class="num__seven">7</button>
                        <button class="num__eight">8</button>
                        <button class="num__nine">9</button>
                        <div class="imgs__number">
                            <button class="num__delete">
                                <img src="../img/delete__number.png" alt="" class="img">
                            </button>
                            <button class="num__zero">0</button>
                            <button class="num__arrow__right">
                                <img src="../img/arrow__right.png" alt="" class="img">
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
