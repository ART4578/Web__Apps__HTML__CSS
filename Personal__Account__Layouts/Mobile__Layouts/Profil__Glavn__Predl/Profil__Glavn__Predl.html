<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Glavn Predl</title>
    <link rel="stylesheet" href="Profil__Glavn__Predl.css">
</head>
<body>
    <!--profil glavn predl-->
    <div class="profil__glavn__predl">
        <div class="profil__glavn__predl__block">
            <!--header-->
            <div class="header">
                <div class="header__block">
                    <div class="user__icon">
                        <img src="../img/profile__barter.png" alt="" class="img">
                    </div>
                    <div class="header__text">
                        <p class="txt__head">Привет, Артем</p>
                    </div>
                    <div class="notif__icon">
                        <img src="../img/dashboard__notificartion.png" alt="" class="img">
                    </div>
                </div>
            </div>
            <!--button-->
            <div class="create__btn__block">
                <button class="btn__create">Создать предложение</button>
            </div>
            <!--camera-->
            <div class="camera">
                <div class="camera__block">
                    <img src="../img/camera.png" alt="" class="img">
                </div>
            </div>
            <!--camera divs-->
            <div class="camera__divs">
                <div class="camera__divs__block">
                    <div class="camera__div"></div>
                    <div class="camera__div margin__style"></div>
                    <div class="camera__div margin__style"></div>
                </div>
            </div>
            <!--product-->
            <div class="product">
                <div class="product__block">
                    <p class="pro__txt">Товар/Услуга</p>
                    <div class="product__inp">
                        <input type="text" class="inp" placeholder="Психолог">
                    </div>
                </div>
            </div>
            <!--message-->
            <div class="message">
                <div class="message__block">
                    <p class="mess__txt">Описание</p>
                    <div class="message__inp">
                        <textarea name="message" id="" cols="30" rows="10" class="inp" placeholder="ХХХХХХХХХХХХХХ"></textarea>
                    </div>
                </div>
            </div>
            <!--obulicate-->
            <div class="obulicate">
                <button class="btn__obulicate">Обуликовать</button>
            </div>
            <!--footer menu-->
            <div class="footer__menu">
                <div class="foot__men">
                    <div class="menu__home">
                        <img src="../img/menu__home.png" alt="" class="img">
                    </div>
                    <div class="menu__proekt">
                        <img src="../img/menu__proekt.png" alt="" class="img">
                    </div>
                    <div class="menu__finance">
                        <img src="../img/menu__finance.png" alt="" class="img">
                    </div>
                    <div class="menu__barter">
                        <img src="../img/menu__barter.png" alt="" class="img">
                    </div>
                    <div class="menu__settings">
                        <img src="../img/menu__settings.png" alt="" class="img">
                    </div>
                    <div class="menu__exit">
                        <img src="../img/menu__exit.png" alt="" class="img">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
