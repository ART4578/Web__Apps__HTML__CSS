<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bartery 2</title>
    <link rel="stylesheet" href="Bartery.css">
</head>
<body>
    <!--onboarding 2-->
    <div class="onboarding__two">
        <div class="onboard__block">
            <!--image-->
            <div class="onboard__img">
                <img src="../img/onboarding__2.png" alt="" class="img">
                <div class="barter__text">
                    <img src="../img/barter__text__2.png" alt="" class="img">
                </div>
            </div>
            <!--text-->
            <div class="onboard__txt">
                <div class="text__icon">
                    <p class="text__on">Добро <br> пожаловать <br> <span class="color">в Бартерию</span></p>
                    <img src="../img/union__onboarding.png" alt="" class="img">
                </div>
                <div class="text__content">
                    <p class="cont">Удобный способ обмениваться товарами и <br> услугами  без денег  деньгами с мобильного <br> устройства.</p>
                </div>
                <div class="btn__divs">
                    <div class="divs__block">
                        <div class="block__one"></div>
                        <div class="block__two"></div>
                    </div>
                    <div class="btn__block">
                        <button class="button">Далее</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
