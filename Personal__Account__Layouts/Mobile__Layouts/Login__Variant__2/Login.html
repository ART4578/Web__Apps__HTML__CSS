<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Variant 2</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>
    <!--login-->
    <div class="login">
        <div class="login__block">
            <!--image header-->
            <div class="login__image">
                <img src="../img/login__header.png" alt="" class="img">
            </div>
            <!--login inputs-->
            <div class="login__inputs">
                <!--header-->
                <div class="header__txt">
                    <p class="txt__head">Войдите в свою <br> учетную запись</p>
                </div>
                <!--inputs-->
                <div class="inp__block">
                    <div class="inp__name__block">
                        <input type="text" class="inp" placeholder="Имя">
                    </div>
                </div>
                <div class="inp__block">
                    <div class="inp__password__block">
                        <div class="inp__val">
                            <input type="password" class="inp" placeholder="Пароль">
                        </div>
                        <div class="inp__img">
                            <img src="../img/login__eye-slash.png" alt="" class="img">
                        </div>
                    </div>
                </div>
                <!--button-->
                <div class="btn__sign">
                    <button class="btn">Войти</button>
                </div>
                <!--href texts-->
                <div class="href__text__one">
                    <a href="#" class="href__one">Забыли пользователя / пароль?</a>
                </div>
                <div class="href__text__two">
                    <a href="#" class="href__two">У вас нет учетной записи? <br> <span class="style__color">Создать</span></a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
