<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer</title>
    <link rel="stylesheet" href="Footer.css">
</head>
<body>
    <!--footer-->
    <div class="footer">
        <div class="footer__block">
            <!--footer img-->
            <div class="footer__img__block">
                <img src="../img/footer__img.png" alt="">
            </div>
            <!--footer union imgs-->
            <div class="footer__union__block">
                <div class="footer__unions">
                    <div class="footer__union__child">
                        <img src="../img/union__img.png" alt="" class="img">
                    </div>
                    <div class="footer__union__childs">
                        <img src="../img/union__img.png" alt="" class="img">
                    </div>
                    <div class="footer__union__childs">
                        <img src="../img/union__img.png" alt="" class="img">
                    </div>
                    <div class="footer__union__childs">
                        <img src="../img/union__img.png" alt="" class="img">
                    </div>
                    <div class="footer__union__childs">
                        <img src="../img/union__img.png" alt="" class="img">
                    </div>
                </div>
            </div>
            <!--footer contact-->
            <div class="footer__contact__block">
                <!--header text-->
                <div class="contact__head">
                    <p class="contact__head__txt">КОНТАКТЫ</p>
                </div>
                <!--barter text-->
                <div class="contact__barter__txt">
                    <p class="cont__bart__text">По вопросам участия в Бартерии пишите:</p>
                </div>
                <!--contact-->
                <div class="contact">
                    <div class="contact__div">
                        <div class="contact__info">
                            <div class="cont__info__txt">
                                <p class="text__info">info@barteria.fun</p>
                            </div>
                            <div class="cont__info__icon">
                                <div class="icon__block">
                                    <img src="../img/info__img.png" alt="" class="img">
                                </div>
                            </div>
                        </div>
                        <div class="contact__bot">
                            <div class="cont__bot__txt">
                                <p class="text__bot">@barteria_bot</p>
                            </div>
                            <div class="cont__bot__icon">
                                <div class="icon__block">
                                    <img src="../img/bot__img.png" alt="" class="img">
                                </div>
                            </div>
                        </div>
                        <div class="contact__mobile">
                            <div class="cont__mobile__txt">
                                <p class="text__mobile">8 800 555 35 35</p>
                            </div>
                            <div class="cont__mobile__icon">
                                <div class="icon__block">
                                    <img src="../img/mobile__img.png" alt="" class="img">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--contact content-->
                <div class="contact__content">
                    <p class="conten__txt">Зарегистрироваться и узнать подробности можно <br> в чат-боте @barteria_bot</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
