<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>
    <!--login-->
    <div class="login">
        <!--text block 1-->
        <div class="text__block__one">
            <img src="../img/bartery__text__1.png" alt="" class="img">
        </div>
        <!--login block-->
        <div class="login__block">
            <div class="block__log">
                <!--header image-->
                <div class="bart__head__icon">
                    <img src="../img/bartery__header.png" alt="" class="img">
                </div>
                <div class="login__div">
                    <!--login inputs-->
                    <div class="login__inputs">
                        <!--input name-->
                        <div class="name__block">
                            <div class="log__name">
                                <input type="text" class="inp" placeholder="Имя">
                            </div>
                        </div>
                        <!--input password-->
                        <div class="password__block">
                            <div class="log__password">
                                <div class="pass__input">
                                    <input type="password" class="inp" placeholder="Пароль">
                                </div>
                                <div class="pass__view">
                                    <img src="../img/eye-slash.png" alt="" class="img">
                                </div>
                            </div>
                        </div>
                        <!--button-->
                        <div class="log__btn__block">
                            <button class="btn">Войти</button>
                        </div>
                        <!--input checkbox-->
                        <div class="check__block">
                            <div class="ch__bl">
                                <div class="chec__inp">
                                    <input type="radio" class="inp">
                                </div>
                                <div class="chec__text">
                                    <p class="txt__ch">Запомнить пароль на этом утсройстве</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!--password recovery-->
                    <div class="password__recovery">
                        <!--recovery header-->
                        <div class="recovery__block">
                            <div class="rec__block">
                                <p class="rec__txt">Восстановление пароля</p>
                            </div>
                        </div>
                        <!--input email-->
                        <div class="email__block">
                            <div class="log__email">
                                <input type="text" class="inp" placeholder="E-mail">
                            </div>
                        </div>
                        <!--input mobile-->
                        <div class="mobile__block">
                            <div class="log__mobile">
                                <input type="text" class="inp" placeholder="Телефон">
                            </div>
                        </div>
                    </div>
                </div>
                <!--image-->
                <div class="icon__img">
                    <img src="../img/asset.png" alt="" class="img">
                </div>
            </div>
        </div>
        <!--text block 2-->
        <div class="text__block__two">
            <img src="../img/bartery__text__2.png" alt="" class="img">
        </div>
    </div>
</body>
</html>
