<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery New Password</title>
    <link rel="stylesheet" href="Password__Recovery__New__Password.css">
</head>
<body>
    <!--login-->
    <div class="login">
        <!--text block 1-->
        <div class="text__block__one">
            <img src="../img/bartery__text__1.png" alt="" class="img">
        </div>
        <!--login block-->
        <div class="login__block">
            <div class="block__log">
                <!--header image-->
                <div class="bart__head__icon">
                    <img src="../img/bartery__header.png" alt="" class="img">
                </div>
                <div class="login__div">
                    <!--login inputs-->
                    <div class="login__inputs">
                        <!--password-->
                        <div class="password__block__one">
                            <div class="log__password__one">
                                <div class="pass__input__one">
                                    <input type="password" class="inp" placeholder="Пароль">
                                </div>
                                <div class="pass__view__one">
                                    <img src="../img/eye-slash.png" alt="" class="img">
                                </div>
                            </div>
                        </div>
                        <!--new password-->
                        <div class="password__block">
                            <div class="log__password">
                                <div class="pass__input">
                                    <input type="password" class="inp" placeholder="Обновите пароль">
                                </div>
                                <div class="pass__view">
                                    <img src="../img/eye-slash.png" alt="" class="img">
                                </div>
                            </div>
                        </div>
                        <!--repeat password-->
                        <div class="password__block">
                            <div class="log__password">
                                <div class="pass__input">
                                    <input type="password" class="inp" placeholder="Повторите пароль">
                                </div>
                                <div class="pass__view">
                                    <img src="../img/eye-slash.png" alt="" class="img">
                                </div>
                            </div>
                        </div>
                        <!--button-->
                        <div class="log__btn__block">
                            <button class="btn">Войти</button>
                        </div>
                    </div>
                    <!--password recovery-->
                    <div class="password__recovery">
                        <div class="union__block">
                            <img src="../img/union__img.png" alt="" class="img">
                        </div>
                    </div>
                </div>
                <!--image-->
                <div class="icon__img">
                    <img src="../img/asset.png" alt="" class="img">
                </div>
            </div>
        </div>
        <!--text block 2-->
        <div class="text__block__two">
            <img src="../img/bartery__text__2.png" alt="" class="img">
        </div>
    </div>
</body>
</html>
