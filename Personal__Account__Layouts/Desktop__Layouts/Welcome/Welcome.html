<!DOCTYPE html>
<html lang="en">
<head>

    <title>Welcome</title>
    <link rel="stylesheet" href="Welcome.css">
</head>
<body>

    <div class="welcome">

        <div class="content">

            <div class="content__img">
                <div class="cont__image">
                    <img src="../img/welocome__asset.png" alt="" class="img">

            </div>

            <div class="content__header">
                <p class="header__text">ДОБРО <br> ПОЖАЛОВАТЬ <br> В КЛУБ</p>

                </div>
            </div>
        </div>
        <!--bartery texts-->
        <div class="welcome__bartery__block">
            <div class="wel__bart__one">
                <img src="../img/welcome__bartery__one.png" alt="" class="img">
            </div>
            <div class="wel__bart__two">
                <p class="bart__text__two">
                    <img src="../img/welcome__bartery__two.png" alt="" class="img">
