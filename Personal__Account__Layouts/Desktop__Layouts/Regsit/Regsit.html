<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regsit</title>
    <link rel="stylesheet" href="Regsit.css">
</head>
<body>
    <!--login-->
    <div class="login">
        <!--text block 1-->
        <div class="text__block__one">
            <img src="../img/bartery__text__1.png" alt="" class="img">
        </div>
        <!--login block-->
        <div class="login__block">
            <div class="block__log">
                <!--header img-->
                <div class="bart__head__icon">
                    <img src="../img/bartery__header.png" alt="" class="img">
                </div>
                <!--image-->
                <div class="icon__img">
                    <img src="../img/asset.png" alt="" class="img">
                </div>
                <div class="login__div">
                    <!--login inputs-->
                    <div class="login__inputs">
                        <!--input name-->
                        <div class="name__block">
                            <div class="log__name">
                                <input type="text" class="inp" placeholder="Имя">
                            </div>
                        </div>
                        <!--input mobile-->
                        <div class="mobile__block">
                            <div class="log__mobile">
                                <input type="text" class="inp" placeholder="Телефон">
                            </div>
                        </div>
                        <!--input email-->
                        <div class="email__block">
                            <div class="log__email">
                                <input type="text" class="inp" placeholder="E-mail">
                            </div>
                        </div>
                        <!--input checkbox 1-->
                        <div class="check__block__one">
                            <div class="ch__bl__one">
                                <div class="chec__inp__one">
                                    <input type="radio" class="inp">
                                </div>
                                <div class="chec__text__one">
                                    <p class="txt__ch__one">
                                        Согласен на обработку персональных данных</p>
                                </div>
                            </div>
                        </div>
                        <!--input checkbox 2-->
                        <div class="check__block">
                            <div class="ch__bl">
                                <div class="chec__inp">
                                    <input type="radio" class="inp">
                                </div>
                                <div class="chec__text">
                                    <p class="txt__ch">Запомнить пароль на этом утсройстве</p>
                                </div>
                            </div>
                        </div>
                        <!--button-->
                        <div class="log__btn__block">
                            <button class="btn">Присоединиться</button>
                        </div>
                    </div>
                    <!--password recovery-->
                    <div class="password__recovery">
                        <div class="union__block">
                            <img src="../img/union__img.png" alt="" class="img">
                        </div>
                        <div class="href__block">
                            <a href="#" class="href">Уже есть аккаунт? </a>
                        </div>
                        <div class="sign__btn">
                            <button class="button">Войти</button>
                        </div>                 
                    </div>
                </div>
            </div>
        </div>
        <!--text block 2-->
        <div class="text__block__two">
            <img src="../img/bartery__text__2.png" alt="" class="img">
        </div>
    </div>
</body>
</html>
