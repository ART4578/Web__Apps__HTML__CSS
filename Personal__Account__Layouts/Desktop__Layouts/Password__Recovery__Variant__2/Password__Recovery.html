<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery Variant 2</title>
    <link rel="stylesheet" href="Password__Recovery.css">
</head>
<body>
    <!--login-->
    <div class="login">
        <!--text block 1-->
        <div class="text__block__one">
            <img src="../img/bartery__text__1.png" alt="" class="img">
        </div>
        <!--login block-->
        <div class="login__block">
            <div class="block__log">
                <!--header img-->
                <div class="bart__head__icon">
                    <img src="../img/bartery__header.png" alt="" class="img">
                </div>
                <div class="login__div">
                    <!--login inputs-->
                    <div class="login__inputs">
                         <!--recovery header-->
                         <div class="recovery__block">
                            <div class="rec__block">
                                <p class="rec__txt">Восстановление пароля</p>
                            </div>
                        </div>
                        <!--input password recovery-->
                        <div class="pass__rec__block">
                            <div class="log__pass__rec">
                                <input type="email" class="inp" placeholder="Введите адрес электронной почты">
                            </div>
                        </div>
                        <!--button-->
                        <div class="log__btn__block">
                            <button class="btn">Войти</button>
                        </div>
                    </div>
                    <!--password recovery-->
                    <div class="password__recovery">
                        <div class="union__block">
                            <img src="../img/union__img.png" alt="" class="img">
                        </div>
                    </div>
                </div>
                <!--image-->
                <div class="icon__img">
                    <img src="../img/asset.png" alt="" class="img">
                </div>
            </div>
        </div>
        <!--text block 2-->
        <div class="text__block__two">
            <img src="../img/bartery__text__2.png" alt="" class="img">
        </div>
    </div>
</body>
</html>
