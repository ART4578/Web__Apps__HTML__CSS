<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Filter__Mobile.css">
</head>
<body>
    <div class="filter-container">
        <div class="filter-header">
            <span class="filter-title">Фильтры</span>
            <button class="close-button">&times;</button>
        </div>
            <ul class="filter-list">
                <li>Сортировка</li>
                <li>Материал верха</li>
                <li>Внутренний материал</li>
                <li>Цвет</li>
                <li>Размер</li>
                <li>Бренд</li>
                <li>Цена</li>
            </ul>
        <div class="filter-buttons">
            <button class="reset">Сбросить</button>
            <button class="show">Показать</button>
        </div>
    </div>
</body>
</html>
