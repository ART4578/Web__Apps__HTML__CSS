<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Sort__Mobile.css">
</head>
<body>
    <div class="sort-container">
        <div class="sort-header">
            <button class="back-btn">&#8592;</button>
            <span class="sort-title">Сортировать</span>
            <button class="close-btn">&times;</button>
        </div>
            <ul class="sort-options">
                <li>подобрали для вам</li>
                <li>новинки</li>
                <li>сначала дороже</li>
                <li>сначала дешевле</li>
            </ul>
        <div class="sort-buttons">
            <button class="reset">Сбросить</button>
            <button class="show">Показать</button>
        </div>
    </div>
</body>
</html>
