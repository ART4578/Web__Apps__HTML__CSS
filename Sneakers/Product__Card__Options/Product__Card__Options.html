<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Options</title>
    <link rel="stylesheet" href="Product__Card__Options.css">
</head>
<body>
    <div class="main">
        <div class="product__card">
            <div class="product__card__block">
                <!--product card one-->
                <div class="product__card__one">
                    <div class="card__one__block">
                        <div class="heart">
                            <img src="../img/Vector (6).png" alt="" class="img">
                        </div>
                    </div>
                    <div class="product__price__block">
                        <p class="text__content">text</p>
                        <p class="text__price">999 р.</p>
                    </div>
                    <div class="pro__txt__block">
                        <p class="txt__cont">Text</p>
                    </div>
                </div>
                <!--product card two-->
                <div class="product__card__two">
                    <div class="card__two__block">
                        <div class="heart">
                            <img src="../img/Vector (6).png" alt="" class="img">
                        </div>
                        <div class="button__text__link">
                            <button class="btn">Добавить в корзину</button>
                            <div class="text__link__block">
                                <p class="text__link">или  нажмите, чтобы изучить</p>
                            </div>
                        </div>
                    </div>
                    <div class="product__price__block">
                        <p class="text__content">text</p>
                        <p class="text__price">999 р.</p>
                    </div>
                    <div class="pro__txt__block">
                        <p class="txt__cont">Text</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
