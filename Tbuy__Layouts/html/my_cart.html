<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/my_cart.css">
</head>
<body>
    <div class="product">
        <div class="img">
            <img src="../img/8f9d462.webp" alt="">
        </div>
        <div class="name-text">
            <div class="img2">
                <div class="icon">
                    <img src="../img/burning-offer.svg" alt="">
                </div>
                <div class="txt">Վառվող առաջարկ</div>
            </div>
            <div class="text1">
                <p>Apple AirProds Pro</p>
            </div>
            <div class="text2">
                <div class="txt1">
                    <p>Տեղադրում: <span>3 000 AMD</span></p>
                </div>
                <div class="txt2">
                    <img src="../img/x-mark.png" alt="">
                </div>
            </div>
        </div>
        <div class="cost">
            <p>123.000 AMD</p>
        </div>
        <div class="count">
            <div class="coun">
                <div class="deduction">
                    <img src="../img/minus_icon.svg" alt="">
                </div>
                <div class="number">1</div>
                <div class="sum">
                    <img src="../img/plus_icon.svg" alt="">
                </div>
            </div>
        </div>
        <div class="general">
            <p>123.000 AMD</p>
        </div>
        <div class="delete">
            <div class="img-delete">
                <img src="../img/delete_bucket.svg" alt="">
            </div>
        </div>
    </div>
</body>
</html>
