<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/feedback.css">
</head>
<body>
    <div class="main">
        <div class="feedback">
            <div class="header"><h2>ՀԵՏԱԴԱՐՁ ԿԱՊ</h2></div>
            <div class="inp-cont">
                <div class="inp-div">
                    <div class="input5">
                        <div class="inp">
                            <div class="name">
                                <input type="text" placeholder="Անուն" required>
                            </div>
                            <div class="r">*</div>
                        </div>
                        <div class="inp">
                            <div class="name">
                                <input type="text" placeholder="Ազգանուն" required>
                            </div>
                            <div class="r">*</div>
                        </div>
                    </div>
                    <div class="input5">
                        <div class="inp">
                            <div class="phone">
                                <div class="img1">
                                    <img src="../img/armenia.png" alt="">
                                </div>
                                <div class="num"><p>+374</p></div>
                                <div class="img2">
                                    <img src="../img/arrow-down-sign-to-navigate.png" alt="">
                                </div>
                            </div>
                            <div class="inp-phone">
                                <input type="text" required>
                            </div>
                            <div class="r">*</div>
                        </div>
                        <div class="inp">
                            <div class="name">
                                <input type="text" placeholder="Էլ.հասցե" required>
                            </div>
                            <div class="r">*</div>
                        </div>
                    </div>
                    <div class="input5 input6">
                        <div class="inp input7 border">
                            <div class="input8">
                                <div class="code">
                                    <input type="text" placeholder="Ստուգման կոդ" required>
                                </div>
                                <div class="cod">*</div>
                            </div>
                            <div class="input9">
                                <p>41915</p>
                            </div>
                        </div>
                    </div>
                    <div class="input10">
                        <div class="textarea-inp">
                                <textarea name="" id="" cols="30" rows="10" placeholder="Հաղորդագրություն"></textarea> 
                        </div>
                        <div class="text-r">*</div>
                    </div>
                </div>
                <div class="cont-div">
                    <div class="content-div">
                        <div class="phone1">
                            <div class="header1">
                                <h4>Հաճախորդների սպասարկում</h4>
                            </div>
                            <div class="content1">
                                <div class="phone-num">
                                    <div class="icons">
                                        <img src="../img/telephone.png" alt="">
                                    </div>
                                    <div class="txt">
                                        <p>+374 12 600 600</p>
                                    </div>
                                </div>
                                <div class="email-href">
                                    <div class="icons">
                                        <img src="../img/mail.png" alt="">
                                    </div>
                                    <div class="txt a-text">
                                        <a href="#">info@tbuy.am</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="phone2">
                            <div class="header1">
                                <h4>Համագործակցության համար</h4>
                            </div>
                            <div class="content1">
                                <div class="phone-num">
                                    <div class="icons">
                                        <img src="../img/telephone.png" alt="">
                                    </div>
                                    <div class="txt">
                                        <p>+374 77 065 065</p>
                                    </div>
                                </div>
                                <div class="email-href">
                                    <div class="icons">
                                        <img src="../img/mail.png" alt="">
                                    </div>
                                    <div class="txt">
                                        <a href="#">commerce@tbuy.am</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="social">
                            <div class="header2">
                                <h4>We're on social</h4>
                            </div>
                            <div class="social1">
                                <div class="soc">
                                    <div class="s">
                                        <img src="../img/instagram.png" alt="">
                                    </div>
                                    <div class="s">
                                        <img src="../img/facebook.png" alt="">
                                    </div>
                                    <div class="s">
                                        <img src="../img/vk.png" alt="">
                                    </div>
                                    <div class="s">
                                        <img src="../img/linkedin.png" alt="">
                                    </div>
                                    <div class="s">
                                        <img src="../img/youtube.png" alt="">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text"><p>*ով նշված դաշտերը պարտադիր են լրացման համար</p></div>
            <div class="btn">
              <div class="button">
                <button>ՈՒՂԱՐԿԵԼ</button>
              </div>
            </div>
        </div>
    </div>
</body>
</html>
