<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/become_a_seller.css">
</head>
<body>
    <div class="main">
        <div class="become-a-seller">
            <div class="header"><h2>Դառնալ վաճառող</h2></div>
            <div class="inp-div">
                <div class="inp input1">
                    <div class="name">
                        <input type="text" placeholder="Name" required>
                    </div>
                    <div class="r">*</div>
                </div>
                <div class="inp input1">
                    <div class="name">
                        <input type="number" placeholder="ID Number" required>
                    </div>
                    <div class="r">*</div>
                </div>
                <div class="inp input1">
                    <div class="name">
                        <input type="text" placeholder="Surname" required>
                    </div>
                    <div class="r">*</div>
                </div>
                <div class="inp input3">
                    <div class="text">
                        <p>Attach your selife with your passport</p>
                    </div>
                    <div class="requr">*</div>
                    <div class="img3 img5">
                        <img src="../img/download.png" alt="">
                    </div>
                </div>
                <div class="inp input2">
                    <div class="phone">
                        <div class="img1">
                            <img src="../img/armenia.png" alt="">
                        </div>
                        <div class="num"><p>+374</p></div>
                        <div class="img2">
                            <img src="../img/arrow-down-sign-to-navigate.png" alt="">
                        </div>
                    </div>
                    <div class="inp-phone">
                        <input type="text" required>
                    </div>
                    <div class="phone-req">*</div>
                </div>
                <div class="inp input3">
                    <div class="text txt p">
                        <p>Attach your passport scan</p>
                    </div>
                    <div class="requr req re">*</div>
                    <div class="img3 img4">
                        <img src="../img/download.png" alt="">
                    </div>
                </div>    
            </div>
            <div class="href">
                <a href="#">Պայմանագիր<span style="color: #E2000F">*</span></a>
            </div>
            <div class="button">
                <button>Հաստատել</button>
            </div>
        </div>
    </div>
</body>
</html>
