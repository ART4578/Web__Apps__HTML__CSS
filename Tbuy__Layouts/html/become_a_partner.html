<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/become_a_partner.css">
</head>
<body>
    <div class="main">
        <div class="become-a-partner">
            <div class="header">
                <div class="head"><h2>Դառնալ գործընկեր</h2></div>
                <div class="cont"><p>Գրանցել կազմակերպություն</p></div>
            </div>
            <div class="inp-div">
                <div class="inp">
                    <input type="text" placeholder="Ընկերության անվանում">
                </div>
                <div class="select">
                    <div class="content">
                        <p>Գործունեության ոլորտ</p>
                    </div>
                    <div class="icon">
                        <img src="../img/arrow-down-sign-to-navigate.png" alt="">
                    </div>
                </div>
                <div class="inp">
                    <input type="text" placeholder="Տնօրենի անուն">
                </div>
                <div class="inp">
                    <input type="text" placeholder="Գործունեության հասցե">
                </div>
                <div class="inp">
                    <input type="text" placeholder="Տնօրենի ազգանուն">
                </div>
                <div class="inp input">
                    <div class="phone">
                        <div class="img1">
                            <img src="../img/armenia.png" alt="">
                        </div>
                        <div class="num"><p>+374</p></div>
                        <div class="img2">
                            <img src="../img/arrow-down-sign-to-navigate.png" alt="">
                        </div>
                    </div>
                    <div class="inp-phone">
                        <input type="text">
                    </div>
                </div>
                <div class="inp">
                    <input type="text" placeholder="ՀՎՀՀ">
                </div>
                <div class="inp">
                    <input type="text" placeholder="Կոնտակտային Էլ.հասցե">
                </div>   
            </div>
            <div class="footer">
                <div class="button">
                    <button>Գրանցում</button>
                </div>
                <div class="icon-help">
                    <div class="help">
                        <div class="icon-txt"><p>Օգնություն</p></div>
                        <div class="icon-img">
                            <img src="../img/question.png" alt="">
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
