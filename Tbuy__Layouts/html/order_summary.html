<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/order_summary.css">
</head>
<body>
    <div class="order-summary">
        <div class="header">
            <h3>Պատվերի ամփոփում</h3>
        </div>
        <div class="text">
            <p class="p1">2 ապրանքների գինը</p>
            <p class="p2">123.000 AMD</p>
        </div>
        <div class="checkbox">
            <div class="check1">
                <div class="div-check"></div>
                <div class="label1">
                    <label>Առաքում</label>
                </div>
            </div>
            <div class="check1">
                <div class="div-check"></div>
                <div class="label1">
                    <label>Շտապ առաքում</label>
                </div>
            </div>
            <div class="check1">
                <div class="div-check check2">
                    <img src="../img/cropped-yes-favicon.png" alt="">
                </div>
                <div class="label1 label2">
                    <label>Կվերցնեմ ինքս</label>
                </div>
            </div>
        </div>
        <div class="text">
            <p>Ծիծեռնակաբերդի խճուղի 3, Դալմա Գարդեն մոլ, 2-րդ հարկ,<br> Զիգզագ խանութ-սրահ, ք. Երևան, Հայաստան</p>
        </div>
        <div class="text">
            <p class="p1 p3">Ընդհանուր արժեքը</p>
            <p class="p2 p3">123.000 AMD</p>
        </div>
        <div class="checkbox checkb">
            <div class="check1 lab">
              <div class="div-check check2">
                <img src="../img/cropped-yes-favicon.png" alt="">
              </div>
              <div class="label1">
                <label>Համաձայն եմ պայմաններին</label>
              </div>
            </div>
        </div>
        <div class="buttons">
            <button class="btn1">Ուղղարկել պատվերը</button>
            <button class="btn2">Դիտել պատվերը</button>
        </div>
    </div>
</body>
</html>
