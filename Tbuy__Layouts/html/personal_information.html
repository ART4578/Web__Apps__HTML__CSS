<!DOCTYPE html>

            </div>

                        <div class="pass-img1">
                            <img src="../img/show.png" alt="">

                      </div>
                      <div class="pass2 pass4">
                        <div class="pass-inp2">
                            <input type="password" placeholder="Կրկնել գաղտնաբառը">

                        <div class="pass-img2">
