<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/apply_online.css">
</head>
<body>
    <div class="apply-online">
        <div class="header"><h1>Դիմել Օնլայն</h1></div>
        <div class="text"><p>Հայտնի է, որ ընթերցողը, կարդալով հասկանալի տեքստ, չի կարողանա կենտրոնանալ տեքստի<br> ձևավորման վրա 5 օր:</p></div>
        <div class="inp">
            <div class="input1">
                <div class="inp1">
                    <input type="text" placeholder="Armen">
                </div>
                <div class="inp2">
                    <input type="text" placeholder="+374 (44) 56 89 68">
                </div>
            </div>
            <div class="input2">
                <div class="inp3">
                    <input type="text" placeholder="Sahakyan">
                </div>
                <div class="inp4">
                    <input type="email" placeholder="loremipsum@gmail.com">
                </div>    
            </div>
            <div class="input3">
                <div class="inp-file">
                    <div class="img">
                        <img src="../img/Без названия.png" alt="">
                    </div>
                    <div class="img-text">
                        <p>Կցել CV-ին PDF,DOC,DOCX կամ JPG ֆորմատով</p>
                    </div>
                </div>
            </div>
            <div class="input4">
                <div class="message">
                    <textarea name="" id="" cols="30" rows="9" placeholder="Message"></textarea>
                </div>
            </div>
        </div>
        <div class="buttons">
            <div class="button">
                <div class="button1">Չեղարկել</div>
                <div class="button2">Դիմել</div>
            </div>
        </div>
    </div>
</body>
</html>
