<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame 22</title>
    <link rel="stylesheet" href="Frame__22.css">
</head>
<body>
    <div class="main">
        <div class="frame">
            <!--header-->
            <div class="header">
                <p class="head__txt">Заполните форму, чтобы <br> принять участие</p>
            </div>
            <!--inputs-->
            <div class="inputs__block">
                <div class="input__blocks">
                    <div class="inp__div__one">
                        <input class="inp" type="text" placeholder="ФИО">
                    </div>
                    <div class="inp__div__two">
                        <input class="inp" type="text" placeholder="Номер телефона">
                    </div>
                    <div class="inp__div__three">
                        <input class="inp" type="email" placeholder="E-mail">
                    </div>
                </div>
            </div>
            <!--message-->
            <div class="message">
                <p class="message__text">Нажимая кнопку “Отправить” вы соглашаетесь с <br>условиями согласия на обработку персональных <br> данных</p>
            </div>
            <!--button-->
            <div class="btn__block">
                <button class="btn">отправить</button>
            </div>
        </div>
    </div>
</body>
</html>
